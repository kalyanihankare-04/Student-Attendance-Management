<!DOCTYPE html>
<html>
<head>
    <title>Mark Attendance</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }

        th {
            background: #4a69bd;
            color: white;
        }

        select {
            padding: 7px;
        }

        button {
            padding: 7px 15px;
            background: #4a69bd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #4a69bd;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>📝 Mark Attendance</h1>

    <table>

        <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Course</th>
            <th>Attendance</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student['name'] }}</td>
            <td>{{ student['roll_no'] }}</td>
            <td>{{ student['course'] }}</td>

            <td>

                <form method="POST">

                    <input type="hidden"
                           name="student_id"
                           value="{{ student['id'] }}">

                    <select name="status">

                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>

                    </select>

                    <button type="submit">Save</button>

                </form>

            </td>
        </tr>

        {% endfor %}

    </table>

    <a href="/">← Back to Home</a>

</body>
</html>
