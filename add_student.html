<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f6ff;
            text-align: center;
            padding: 40px;
        }

        form {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background: #4a69bd;
            color: white;
            border: none;
            border-radius: 5px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #4a69bd;
        }
    </style>
</head>

<body>

    <h1>➕ Add Student</h1>

    <form method="POST">

        <input type="text" name="name"
               placeholder="Student Name" required>

        <input type="text" name="roll_no"
               placeholder="Roll Number" required>

        <input type="text" name="course"
               placeholder="Course" required>

        <br>

        <button type="submit">Add Student</button>

    </form>

    <a href="/">← Back to Home</a>

</body>
</html>
