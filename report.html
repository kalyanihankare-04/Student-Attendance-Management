<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 80%;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }

        th {
            background: #4a69bd;
            color: white;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #4a69bd;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>📊 Attendance Report</h1>

    <table>

        <tr>
            <th>Student Name</th>
            <th>Roll Number</th>
            <th>Course</th>
            <th>Status</th>
            <th>Date</th>
        </tr>

        {% for record in records %}

        <tr>
            <td>{{ record['name'] }}</td>
            <td>{{ record['roll_no'] }}</td>
            <td>{{ record['course'] }}</td>
            <td>{{ record['status'] }}</td>
            <td>{{ record['date'] }}</td>
        </tr>

        {% endfor %}

    </table>

    <a href="/">← Back to Home</a>

</body>
</html>
